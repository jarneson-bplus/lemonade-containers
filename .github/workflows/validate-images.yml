name: Validate container images

on:
  pull_request:
    paths:
      - ".github/image-matrix.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "base/**"
      - "forks/**"
      - "docker-compose.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full non-publishing image builds (large/slow: downloads ROCm and fork assets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate manifest, configs, entrypoint, compose, and workflows
        run: bash .github/scripts/static-checks.sh

  dockerfile-check:
    name: BuildKit Dockerfile checks
    runs-on: ubuntu-24.04
    needs: static-checks
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Run BuildKit check for each manifest image
        run: bash .github/scripts/dockerfile-check.sh

  full-build-no-push:
    name: Full image build (manual, no push)
    runs-on: ubuntu-24.04
    needs: static-checks
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Build all images without pushing
        run: bash .github/scripts/full-build-no-push.sh
